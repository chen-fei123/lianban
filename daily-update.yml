name: 每日更新连板数据

on:
  schedule:
    # 北京时间每天9:26 = UTC 1:26
    - cron: '26 1 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取数据生成HTML
        run: python daily_update.py

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "每日自动更新 ${{ github.event.repository.updated_at || github.run_id }}"
          git push
