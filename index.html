<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连板梯队 · 数字能量八星涨停复盘</title>
<style>
:root{--bg:#0f1420;--card:#1a2130;--card-2:#212a3d;--border:#2a3448;--text:#e6e9f2;--text-sub:#8b94ab;--primary:#7c6cf0;--primary-soft:#2d2656;--up:#e8443a;--shadow:0 2px 14px rgba(0,0,0,.35)}
[data-theme="dark"]{--bg:#0f1420;--card:#1a2130;--card-2:#212a3d;--border:#2a3448;--text:#e6e9f2;--text-sub:#8b94ab;--primary:#7c6cf0;--primary-soft:#2d2656;--shadow:0 2px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#6b5ce7,#9d8bff);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.brand-title{font-size:20px;font-weight:700}
.brand-sub{font-size:12px;color:var(--text-sub);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--text-sub);font-size:13px;position:relative}
.switch{width:40px;height:22px;border-radius:11px;background:#d5d8e5;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .switch{background:var(--primary)}
.toggle.on .switch::after{transform:translateX(18px)}
.btn{padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:var(--primary);color:#fff}
.date-badge{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text-sub);font-size:13px}
.view-tabs{display:flex;gap:8px;padding:0 28px;margin-bottom:18px}
.view-tab{padding:9px 20px;border-radius:10px;cursor:pointer;font-size:14px;background:var(--card);border:1px solid var(--border);color:var(--text-sub)}
.view-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.search-box{padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;width:220px;outline:none}
.search-box:focus{border-color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 28px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
.stat-num{font-size:30px;font-weight:700}
.stat-label{font-size:13px;color:var(--text-sub);margin-top:6px}
.section{margin:0 28px 18px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.badge-num{width:38px;height:38px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.b1{background:#8a90a6}.b2{background:#4a7fe8}.b3{background:#2bb673}.b4{background:#f39c3d}.b5{background:#e8634f}
.section-title{font-size:17px;font-weight:700}
.section-count{font-size:12px;color:var(--text-sub);background:var(--card-2);padding:2px 10px;border-radius:10px}
.stock-row{display:flex;flex-wrap:wrap;gap:10px;padding-top:10px;border-top:1px dashed var(--border)}
.stock-row:first-of-type{border-top:none;padding-top:0}
.stock-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--card-2);border:1px solid var(--border);font-size:13px}
.stock-code{color:var(--text-sub);font-size:12px;font-family:Consolas,monospace}
.stock-name{font-weight:600}
.stock-price{color:var(--text);font-size:12px;font-weight:600;font-family:Consolas,monospace}
.stock-ind{color:#fff;font-size:11px;background:#6b7a99;padding:2px 8px;border-radius:5px;font-weight:600}
.auction-pct{font-weight:700;font-size:12px}
.auction-amt{color:#f5a623;font-size:11px}
.auction-avr{color:#9b59d0;font-size:11px}
.up{color:#e8443a}.down{color:#17a66a}
.judge-good{color:#2bb673;font-size:11px;font-weight:700}
.judge-bad{color:#e8443a;font-size:11px;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;color:#fff}
.t-shengqi{background:#2bb673}.t-yannian{background:#f37a3d}.t-tianyi{background:#2bb673}.t-fuwei{background:#2bb673}
.t-jueming{background:#e8443a}.t-huohai{background:#4a7fe8}.t-liusha{background:#9b59d0}.t-wugui{background:#9b59d0}
.t-long{background:#f39c3d}
.energy-pop{position:absolute;top:32px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);min-width:160px;display:none;z-index:50}
.energy-pop.show{display:block}
.energy-pop h4{font-size:13px;margin-bottom:10px;color:var(--text-sub)}
.energy-pop label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.energy-pop input{width:15px;height:15px;accent-color:var(--primary)}
.strategy-bar{display:flex;flex-wrap:wrap;gap:10px;padding:0 28px;margin-bottom:18px}
.sbtn{padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;background:var(--card);border:1px solid var(--border);color:var(--text)}
.sbtn.active{background:linear-gradient(135deg,#e8443a,#f37a3d);color:#fff;border-color:transparent}
.filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 28px;margin-bottom:18px}
.filter-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.filter-label{font-size:13px;color:var(--text-sub);margin-bottom:10px;font-weight:600}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:5px 12px;border-radius:8px;background:var(--card-2);border:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--text)}
.fchip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.scan-info{padding:0 28px;margin-bottom:14px;color:var(--text-sub);font-size:13px}
.ind-group{margin:0 28px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px}
.ind-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:15px}
.ind-count{font-size:12px;color:var(--text-sub);background:var(--card-2);padding:2px 10px;border-radius:10px;font-weight:400}
.result-float{position:fixed;right:28px;bottom:28px;width:320px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.18);z-index:100;overflow:hidden}
.result-float.hidden{display:none}
.result-head{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.result-close{cursor:pointer;color:var(--text-sub)}
.result-item{padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px}
.result-item:last-child{border-bottom:none}
@media(max-width:900px){.stats,.filter-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-logo">8</div><div><div class="brand-title">连板梯队</div><div class="brand-sub">数字能量八星 · 涨停复盘</div></div></div>
  <div class="topbar-right">
    <div class="toggle on" id="toggleEnergy"><span class="switch"></span><span>数字能量 ▾</span>
      <div class="energy-pop" id="energyPop">
        <h4>数字能量标签</h4>
        <label><input type="checkbox" id="chkMaster" checked> 启用数字能量</label>
        <label><input type="checkbox" class="chk-tag" data-tag="生气" checked> 生气</label>
        <label><input type="checkbox" class="chk-tag" data-tag="延年" checked> 延年</label>

        <label><input type="checkbox" class="chk-tag" data-tag="绝命" checked> 绝命</label>
        <label><input type="checkbox" class="chk-tag" data-tag="祸害" checked> 害(祸害)</label>

  </div>
</div>

<div class="view-tabs">
  <input type="text" id="searchBox" class="search-box" placeholder="搜索股票名称/代码..." oninput="onSearch(this.value)">
</div>

<div class="stats" style="grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px">
  <div class="stat-card" style="padding:10px 14px"><div class="stat-num" id="statTotal" style="font-size:22px">-</div><div class="stat-label" style="font-size:11px;margin-top:2px">涨停总数</div></div>
  <div class="stat-card" style="padding:10px 14px"><div class="stat-num" id="statSector" style="font-size:22px">-</div><div class="stat-label" style="font-size:11px;margin-top:2px">板块梯队</div></div>
  <div class="stat-card" style="padding:10px 14px"><div class="stat-num" id="statMax" style="font-size:22px">-</div><div class="stat-label" style="font-size:11px;margin-top:2px">最高连板</div></div>
  <div class="stat-card" style="padding:10px 14px"><div class="stat-num" id="statJi" style="font-size:22px">-</div><div class="stat-label" style="font-size:11px;margin-top:2px">看好标的</div></div>
</div>

<div class="filter-row" style="padding:0 28px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap">
  <div class="filter-box">
    <div class="filter-label" style="font-size:12px;color:var(--text-sub);margin-bottom:6px">连板高度</div>
    <div class="filter-chips" data-f="lbc" style="display:flex;flex-wrap:wrap;gap:4px">
      <div class="fchip active" data-v="all" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">全部</div>
      <div class="fchip" data-v="1" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">首板</div>
      <div class="fchip" data-v="2" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">2板</div>
      <div class="fchip" data-v="3" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">3板</div>
      <div class="fchip" data-v="4" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">4板</div>
      <div class="fchip" data-v="5" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">5板+</div>
    </div>
  </div>
  <div class="filter-box">
    <div class="filter-label" style="font-size:12px;color:var(--text-sub);margin-bottom:6px">市场类型</div>
    <div class="filter-chips" data-f="market" style="display:flex;flex-wrap:wrap;gap:4px">
      <div class="fchip active" data-v="all" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">全部</div>
      <div class="fchip" data-v="沪主板" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">沪主板</div>
      <div class="fchip" data-v="深主板" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">深主板</div>
      <div class="fchip" data-v="创业板" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">创业板</div>
      <div class="fchip" data-v="科创板" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">科创板</div>
      <div class="fchip" data-v="北交所" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">北交所</div>
    </div>
  </div>
  <div class="filter-box">
    <div class="filter-label" style="font-size:12px;color:var(--text-sub);margin-bottom:6px">流通市值</div>
    <div class="filter-chips" data-f="ltsz" style="display:flex;flex-wrap:wrap;gap:4px">
      <div class="fchip active" data-v="all" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">全部</div>
      <div class="fchip" data-v="0-30" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">&lt;30亿</div>
      <div class="fchip" data-v="30-50" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">30-50亿</div>
      <div class="fchip" data-v="50-80" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">50-80亿</div>
      <div class="fchip" data-v="80-120" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">80-120亿</div>
      <div class="fchip" data-v="120-9999" style="padding:4px 10px;border-radius:6px;background:var(--card-2);cursor:pointer;font-size:12px">120亿+</div>
    </div>
  </div>
</div>

<div id="viewLadder"></div>
<div id="extResult" style="display:none;padding:0 28px;margin-bottom:14px">
  <div class="section" style="margin:0">
    <div class="section-head"><div class="badge-num b3">搜</div><div class="section-title">外部搜索结果</div></div>
    <div id="extBody"></div>
  </div>
</div>

<script>
let D = {date:"",yest:"",total:0,maxLbc:0,jiCount:0,industries:0,ladder:[]};
let showEnergy = true;
let visibleTags = new Set(["生气","延年","天医","伏位","绝命","祸害","六煞","五鬼"]);
let searchKw = "";
const sel = {lbc:new Set(["all"]), market:new Set(["all"]), ltsz:new Set(["all"])};

function passFilter(s){
  if(!sel.lbc.has("all")){
    let ok=false;
    for(const v of sel.lbc){ if(v==="5"?s.lbc>=5:s.lbc===+v){ok=true;break;} }
    if(!ok) return false;
  }
  if(!sel.market.has("all") && !sel.market.has(s.market)) return false;
  if(!sel.ltsz.has("all")){
    let ok=false;
    for(const v of sel.ltsz){ const [a,b]=v.split("-").map(Number); if(s.ltsz>=a&&s.ltsz<b){ok=true;break;} }
    if(!ok) return false;
  }
  return true;
}

// 八星表
const BABY={"14":"生气","41":"生气","67":"生气","76":"生气","39":"生气","93":"生气","28":"生气","82":"生气","19":"延年","91":"延年","78":"延年","87":"延年","34":"延年","43":"延年","26":"延年","62":"延年","13":"天医","31":"天医","68":"天医","86":"天医","49":"天医","94":"天医","27":"天医","72":"天医","11":"伏位","22":"伏位","88":"伏位","99":"伏位","66":"伏位","77":"伏位","33":"伏位","44":"伏位","12":"绝命","21":"绝命","69":"绝命","96":"绝命","48":"绝命","84":"绝命","37":"绝命","73":"绝命","17":"祸害","71":"祸害","89":"祸害","98":"祸害","46":"祸害","64":"祸害","23":"祸害","32":"祸害","16":"六煞","61":"六煞","47":"六煞","74":"六煞","38":"六煞","83":"六煞","29":"六煞","92":"六煞","18":"五鬼","81":"五鬼","79":"五鬼","97":"五鬼","36":"五鬼","63":"五鬼","24":"五鬼","42":"五鬼"};
const AUSPICIOUS=new Set(["生气","延年","天医","伏位"]);
function babyTags(code){
  const cnt={};
  for(let i=0;i<code.length-1;i++){
    const p=code.substr(i,2);
    if(p[0]==="0") continue;
    const t=BABY[p];
    if(t) cnt[t]=(cnt[t]||0)+1;
  }
  const order=["生气","延年","天医","伏位","绝命","祸害","六煞","五鬼"];
  return order.filter(n=>cnt[n]>0).map(n=>cnt[n]===1?n:n+"×"+cnt[n]);
}
function babyJudge(code){
  const cnt={};
  for(let i=0;i<code.length-1;i++){
    const p=code.substr(i,2);
    if(p[0]==="0") continue;
    const t=BABY[p];
    if(t) cnt[t]=(cnt[t]||0)+1;
  }
  let ji=0,xiong=0;
  for(const k in cnt){ if(AUSPICIOUS.has(k)) ji+=cnt[k]; else xiong+=cnt[k]; }
  return ji>xiong?"good":xiong>ji?"bad":"neutral";
}
function marketOf(code){
  if(code.startsWith("60")) return "沪主板";
  if(code.startsWith("000")||code.startsWith("001")||code.startsWith("002")||code.startsWith("003")) return "深主板";
  if(code.startsWith("300")||code.startsWith("301")) return "创业板";
  if(code.startsWith("688")) return "科创板";
  return "北交所";
}

// 实时拉涨停池
async function loadData(){
  document.getElementById("viewLadder").innerHTML='<div class="section" style="text-align:center;padding:40px;color:var(--text-sub)">正在拉取实时涨停数据...</div>';
  const today=new Date();
  let ymd=today.getFullYear()+String(today.getMonth()+1).padStart(2,"0")+String(today.getDate()).padStart(2,"0");
  // 找最近有数据的交易日
  let pool=[];
  for(let d=0;d<6;d++){
    const dt=new Date(today); dt.setDate(dt.getDate()-d);
    const ds=dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0");
    try{
      const r=await fetch(`https://push2ex.eastmoney.com/getTopicZTPool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=500&sort=fbt:asc&date=${ds}`);
      const j=await r.json();
      if(j.data&&j.data.pool&&j.data.pool.length){ pool=j.data.pool; ymd=ds; break; }
    }catch(e){}
  }
  if(!pool.length){ document.getElementById("viewLadder").innerHTML='<div class="section" style="text-align:center;padding:40px;color:var(--text-sub)">暂无数据</div>'; return; }

  // 拉腾讯行情补竞价数据
  const codes=pool.map(s=>s.c);
  const quotes=await fetchQuotes(codes);

  // 组装rows
  const rows=pool.map(s=>{
    const code=s.c;
    const q=quotes[code]||{};
    return {
      code:code, name:s.n||"", lbc:s.lbc||1,
      pct:s.zdp||0, price:(s.p||0)/1000,
      industry:s.hybk||"其他",
      ltsz:Math.round((s.ltsz||0)/1e8*10)/10,
      hs:s.hs||0, market:marketOf(code),
      baby:babyTags(code), judge:babyJudge(code),
      apct:q.apct||0, aamt:q.aamt||0, avr:q.avr||0, rtPct:q.rtPct||0, rtPrice:q.rtPrice||0
    };
  });

  // 龙一龙二
  const byInd={};
  rows.forEach(r=>{ if(!byInd[r.industry]) byInd[r.industry]=[]; byInd[r.industry].push(r); });
  for(const ind in byInd){
    byInd[ind].sort((a,b)=>b.lbc-a.lbc);
    byInd[ind].forEach((r,i)=>{ r.long=i<3?"龙"+(i+1):""; });
  }
  rows.sort((a,b)=>b.lbc-a.lbc||b.apct-a.apct);

  // 分组
  const g={};
  rows.forEach(r=>{ if(!g[r.lbc]) g[r.lbc]=[]; g[r.lbc].push(r); });
  const ladder=Object.keys(g).map(k=>({boards:+k,stocks:g[k]})).sort((a,b)=>b.boards-a.boards);

  D={
    date:ymd, yest:ymd, total:rows.length,
    maxLbc:rows.length?Math.max(...rows.map(r=>r.lbc)):0,
    jiCount:rows.filter(r=>r.judge==="good").length,
    industries:Object.keys(byInd).length,
    ladder:ladder
  };
  renderLadder();
}

function fetchQuotes(codes){
  return new Promise(resolve=>{
    const result={};
    const batches=[];
    for(let i=0;i<codes.length;i+=20) batches.push(codes.slice(i,i+20));
    let done=0;
    batches.forEach(batch=>{
      const q=batch.map(c=>(c.startsWith("60")?"sh":"sz")+c).join(",");
      const s=document.createElement("script");
      s.src="https://qt.gtimg.cn/q="+q;
      s.onload=function(){
        batch.forEach(c=>{
          const varName=(c.startsWith("60")?"sh":"sz")+c;
          try{
            const raw=window[varName];
            if(!raw) return;
            const p=raw.split("~");
            if(p.length<50) return;
            const op=parseFloat(p[5])||0, pc=parseFloat(p[4])||0;
            result[c]={
              apct:pc?Math.round((op-pc)/pc*10000)/100:0,
              aamt:parseFloat(p[37])||0,
              avr:parseFloat(p[49])||0,
              rtPct:parseFloat(p[32])||0,
              rtPrice:parseFloat(p[3])||0
            };
          }catch(e){}
        });
        document.head.removeChild(s);
        done++; if(done===batches.length) resolve(result);
      };
      s.onerror=function(){ document.head.removeChild(s); done++; if(done===batches.length) resolve(result); };
      document.head.appendChild(s);
    });
  });
}
function onSearch(v){
  searchKw=v.trim().toLowerCase();
  const ext=document.getElementById("extResult");
  const q=v.trim();
  if(/^\d{6}$/.test(q)){
    ext.style.display="";
    document.getElementById("extBody").innerHTML='<span style="color:var(--text-sub)">加载中 '+q+' ...</span>';
    searchExternal(q).then(info=>showExtResult(info)).catch(()=>{
      document.getElementById("extBody").innerHTML='<span style="color:var(--text-sub)">未找到 '+q+'</span>';
    });
  } else if(q && !allStocks().some(s=>matchSearch(s))){
    ext.style.display="";
    document.getElementById("extBody").innerHTML='<span style="color:var(--text-sub)">搜索 '+q+' ...</span>';
    searchByName(q).then(code=>{
      if(code) return searchExternal(code).then(info=>showExtResult(info));
      throw "nf";
    }).catch(()=>{
      document.getElementById("extBody").innerHTML='<span style="color:var(--text-sub)">未找到 "'+q+'"，请确认名称或输入6位代码</span>';
    });
  } else {
    ext.style.display="none";
  }
  renderLadder();
}
function showExtResult(info){
  const tags=info.tags.map(t=>'<span class="tag '+tagClass(t)+'">'+t+'</span>').join("");
  document.getElementById("extBody").innerHTML=
    '<div class="stock-chip" style="font-size:14px;padding:10px 16px">'+
    '<span class="stock-code">'+info.code+'</span>'+
    '<span class="stock-name">'+info.name+'</span>'+
    judgeHtml(info.judge)+tags+
    '<span style="color:var(--text-sub);font-size:12px">现价'+info.price+' 涨跌'+info.pct+'%</span>'+
    '</div>';
}
function searchByName(name){
  return new Promise((resolve,reject)=>{
    const cb="se_cb_"+Date.now();
    window[cb]=function(data){
      try{
        const tbl=data.QuotationCodeTable;
        const arr=(tbl&&tbl.Data)||[];
        const hit=arr.find(x=>x.Name&&x.Name.indexOf(name)>=0);
        window[cb]=undefined;
        const el=document.getElementById("se_"+cb); if(el) document.head.removeChild(el);
        resolve(hit?hit.Code:null);
      }catch(e){ reject(e); }
    };
    const s=document.createElement("script");
    s.id="se_"+cb;
    s.src="https://searchapi.eastmoney.com/api/suggest/get?input="+encodeURIComponent(name)+"&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=5&cb="+cb;
    s.onerror=()=>{ window[cb]=undefined; try{document.head.removeChild(s);}catch(e){} reject("err"); };
    document.head.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ window[cb]=undefined; try{document.head.removeChild(s);}catch(e){} reject("timeout"); } },5000);
  });
}
function matchSearch(s){ if(!searchKw) return true; return s.name.toLowerCase().includes(searchKw)||s.code.includes(searchKw); }

function searchExternal(code){
  return new Promise((resolve,reject)=>{
    const prefix=code.startsWith("60")?"sh":"sz";
    const varName="v_"+prefix+code;
    window[varName]=undefined;
    const s=document.createElement("script");
    s.src="https://qt.gtimg.cn/q="+prefix+code;
    s.onload=function(){
      try{
        const raw=window[varName];
        if(!raw) return reject("no data");
        const p=raw.split("~");
        if(p.length<50) return reject("bad data");
        const tags=babyTags(code);
        const judge=babyJudge(code);
        resolve({code:code,name:p[1],price:p[3],pct:p[32],tags:tags,judge:judge});
        document.head.removeChild(s);
      }catch(e){ reject(e); }
    };
    s.onerror=()=>reject("error");
    document.head.appendChild(s);
  });
}

function tagClass(t){
  if(t.indexOf("生气")===0) return "t-shengqi";
  if(t.indexOf("延年")===0) return "t-yannian";
  if(t.indexOf("天医")===0) return "t-tianyi";
  if(t.indexOf("伏位")===0) return "t-fuwei";
  if(t.indexOf("绝命")===0) return "t-jueming";
  if(t.indexOf("祸害")===0) return "t-huohai";
  if(t.indexOf("六煞")===0) return "t-liusha";
  if(t.indexOf("五鬼")===0) return "t-wugui";
  return "t-fuwei";
}
function tagVisible(t){ for(const k of visibleTags) if(t.indexOf(k)===0) return true; return false; }
function judgeHtml(j){ return j==="good"?'<span class="judge-good">√看好</span>':j==="bad"?'<span class="judge-bad">×不看好</span>':''; }

function allStocks(){
  const arr=[];
  D.ladder.forEach(g=>g.stocks.forEach(s=>arr.push(s)));
  return arr;
}

function renderLadder(){
  document.getElementById("statTotal").textContent=D.total;
  document.getElementById("statSector").textContent=D.industries;
  document.getElementById("statMax").textContent=D.maxLbc;
  document.getElementById("statJi").textContent=D.jiCount;
  document.getElementById("dateBadge").textContent="数据日期 "+D.date;
  document.getElementById("viewLadder").innerHTML = D.ladder.map(g=>{
    const list=g.stocks.filter(matchSearch).filter(passFilter);
    if(!list.length) return "";
    const chips=list.map(s=>{
      let tags="";
      if(showEnergy) tags=s.baby.filter(tagVisible).map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join("");
      const long = s.long?`<span class="tag t-long">${s.long}</span>`:"";
      const ind = s.industry?`<span class="stock-ind">${s.industry}</span>`:"";
      const rt = s.rtPrice?`<span class="stock-price">${s.rtPrice}</span>`:"";
      const rtPct = s.rtPct?`<span class="auction-pct ${s.rtPct>=0?'up':'down'}">${s.rtPct>=0?'+':''}${s.rtPct}%</span>`:"";
      return `<div class="stock-chip"><span class="stock-code">${s.code}</span><span class="stock-name">${s.name}</span>${rt}${rtPct}${judgeHtml(s.judge)}${long}${tags}${ind}</div>`;
    }).join("");
    const bc=Math.min(g.boards,5);
    return `<div class="section"><div class="section-head"><div class="badge-num b${bc}">${g.boards}</div><div class="section-title">${g.boards>1?g.boards+" 连板":"首板"}</div><div class="section-count">共 ${list.length} 只</div></div><div class="stock-row">${chips}</div></div>`;
  }).join("");
}

/* 筛选按钮 */
document.querySelectorAll(".filter-chips").forEach(g=>{
  const key=g.dataset.f; if(!key) return;
  g.querySelectorAll(".fchip").forEach(c=>{
    c.addEventListener("click",()=>{
      const v=c.dataset.v;
      if(v==="all"){ sel[key]=new Set(["all"]); g.querySelectorAll(".fchip").forEach(x=>x.style.background=x.dataset.v==="all"?"var(--primary)":"var(--card-2)"); }
      else{
        sel[key].delete("all");
        g.querySelector('[data-v="all"]').style.background="var(--card-2)";
        if(sel[key].has(v)){ sel[key].delete(v); c.style.background="var(--card-2)"; }
        else{ sel[key].add(v); c.style.background="var(--primary)"; }
        if(sel[key].size===0){ sel[key].add("all"); g.querySelector('[data-v="all"]').style.background="var(--primary)"; }
      }
      renderLadder();
    });
  });
});

/* 数字能量 */
document.getElementById("toggleEnergy").addEventListener("click",function(e){e.stopPropagation();document.getElementById("energyPop").classList.toggle("show");});
document.addEventListener("click",function(e){if(!e.target.closest("#toggleEnergy"))document.getElementById("energyPop").classList.remove("show");});
document.getElementById("chkMaster").addEventListener("change",function(){showEnergy=this.checked;document.querySelectorAll(".chk-tag").forEach(c=>c.disabled=!showEnergy);renderLadder();});
document.querySelectorAll(".chk-tag").forEach(c=>c.addEventListener("change",function(){if(this.checked)visibleTags.add(this.dataset.tag);else visibleTags.delete(this.dataset.tag);renderLadder();}));

loadData();
