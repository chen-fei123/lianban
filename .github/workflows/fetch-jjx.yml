name: 抓取竞价数据

on:
  schedule:
    # 每天9:26（北京时间，UTC+8，对应UTC 1:26）
    - cron: "26 1 * * 1-5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行竞价抓取脚本
        run: python fetch_jjx.py
      - name: 提交JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jjx_data.json
          git commit -m "更新竞价数据 $(date '+%Y-%m-%d %H:%M')" || echo "无变化"
          git push
